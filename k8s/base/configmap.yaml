apiVersion: v1
kind: ConfigMap
metadata:
  name: relay-config
  namespace: relay
data:
  PORT: "8080"
  PG_POOL_MAX: "8"
  DEDUPE_MAX_ENTRIES: "10000"
  OTEL_SERVICE_NAME: relay
  # Metrics go out unsampled, so rate, error rate and the percentiles are the
  # real numbers. Only traces are sampled.
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: "0.1"
