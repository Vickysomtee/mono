apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: relay
  labels:
    app: relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: relay
      initContainers:
        - name: migrate
          image: relay:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "src/migrate.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: relay-secrets
                  key: DATABASE_URL
            - name: SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: relay-secrets
                  key: SIGNING_SECRET
      containers:
        - name: relay
          image: relay:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: relay-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: relay-secrets
                  key: DATABASE_URL
            - name: SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: relay-secrets
                  key: SIGNING_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 2
          resources:
            limits:
              memory: 256Mi
