name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys queue, they do not cancel. Killing a run mid-apply leaves the
# cluster halfway through a change with nothing to tell you which half.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPO: 123456789012.dkr.ecr.eu-west-1.amazonaws.com/relay
  EKS_CLUSTER: relay-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push
        run: |
          docker build -t "$ECR_REPO:$GITHUB_SHA" app
          docker push "$ECR_REPO:$GITHUB_SHA"

      - name: Deploy
        env:
          ACTOR: ${{ github.actor }}
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
          kubectl apply -f k8s/base/

          # One patch rather than set image plus annotate, so the change-cause
          # lands on the new ReplicaSet only. Annotating separately relabels
          # the revision that is already there and `rollout history` then
          # names the same commit twice, which is what the rollback workflow
          # reads to pick a revision.
          kubectl -n relay patch deployment/relay -p "$(jq -nc \
            --arg image "$ECR_REPO:$GITHUB_SHA" \
            --arg cause "$GITHUB_SHA by $ACTOR (run $GITHUB_RUN_ID)" \
            '{metadata:{annotations:{"kubernetes.io/change-cause":$cause}},
              spec:{template:{spec:{
                containers:[{name:"relay",image:$image}],
                initContainers:[{name:"migrate",image:$image}]}}}}')"

          kubectl -n relay rollout status deployment/relay --timeout=10m
          kubectl -n relay rollout history deployment/relay

          # The Deployment has no replicas field, so the HPA owns the count.
          # Without metrics-server the HPA cannot scale at all and production
          # would quietly sit at one pod, so fail the deploy instead.
          kubectl -n relay wait --for=condition=ScalingActive hpa/relay --timeout=3m
          kubectl -n relay get hpa relay
